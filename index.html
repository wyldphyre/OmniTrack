<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OmniTrack">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" id="app-icon">
    <link rel="icon" type="image/png" id="favicon">
    <title>OmniTrack</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: #000; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            min-height: 100dvh;
            color: #fff;
            padding: 0 16px 130px;
            padding-top: max(16px, env(safe-area-inset-top));
        }

        .container { max-width: 600px; margin: 0 auto; }

        /* Header */
        .app-header {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 8px 0 20px;
        }

        .app-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .settings-btn {
            position: absolute;
            right: 0;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: rgba(255,255,255,0.55);
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .settings-btn:hover { color: #fff; }
        .settings-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* Cards */
        .omnibus-card {
            background: #1c1c1e;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .omnibus-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .omnibus-title {
            font-size: 1.05rem;
            font-weight: 600;
            flex: 1;
            line-height: 1.3;
        }

        .omnibus-menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            color: rgba(255,255,255,0.35);
            transition: color 0.2s;
            margin-top: -2px;
            margin-right: -4px;
        }

        .omnibus-menu-btn:hover { color: rgba(255,255,255,0.75); }
        .omnibus-menu-btn svg { width: 18px; height: 18px; fill: currentColor; display: block; }

        .omnibus-meta {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 12px;
        }

        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: #30d158;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .progress-fill.child { background: rgba(48, 209, 88, 0.5); }

        /* Progress Controls */
        .progress-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .progress-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .progress-btn:active { background: rgba(255,255,255,0.22); }

        .progress-value {
            font-size: 1.35rem;
            font-weight: 700;
            min-width: 72px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* Child Books */
        .child-books {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 12px;
        }

        .child-books-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 8px;
            user-select: none;
        }

        .child-books-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .collapse-chevron {
            color: rgba(255,255,255,0.3);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
        }

        .collapse-chevron svg { width: 14px; height: 14px; fill: currentColor; }
        .collapse-chevron.collapsed { transform: rotate(-90deg); }

        .child-books-content {
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .child-books-content.collapsed { max-height: 0 !important; }

        .child-book {
            background: #2c2c2e;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .child-book:last-child { margin-bottom: 0; }

        .child-book-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .child-book-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .child-book-meta {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.38);
            margin-top: 2px;
        }

        .child-book-edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: rgba(255,255,255,0.28);
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .child-book-edit-btn:hover { color: rgba(255,255,255,0.65); }
        .child-book-edit-btn svg { width: 14px; height: 14px; fill: currentColor; display: block; }

        .child-progress-bar { height: 4px; }

        /* Bottom Toolbar */
        .bottom-toolbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: rgba(18,18,20,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.09);
            border-radius: 20px 20px 0 0;
            padding: 12px 20px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 100;
        }

        .toolbar-btn-import {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 12px;
            color: rgba(255,255,255,0.75);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .toolbar-btn-import:active { background: rgba(255,255,255,0.18); }
        .toolbar-btn-import svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        .toolbar-btn-new {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 20px;
            background: #30d158;
            border: none;
            border-radius: 14px;
            color: #000;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .toolbar-btn-new:active { opacity: 0.8; }
        .toolbar-btn-new svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

        /* Sheets */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .sheet-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet {
            position: fixed;
            bottom: 0;
            left: 50%;
            width: 100%;
            max-width: 600px;
            background: #1c1c1e;
            border-radius: 20px 20px 0 0;
            padding: 0 20px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            max-height: 90dvh;
            overflow-y: auto;
            transform: translateX(-50%) translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 1001;
        }

        .sheet.visible { transform: translateX(-50%) translateY(0); }

        .sheet-handle-row {
            display: flex;
            justify-content: center;
            padding: 10px 0 4px;
            position: sticky;
            top: 0;
            background: #1c1c1e;
            cursor: grab;
            touch-action: none;
        }

        .sheet-handle-row:active { cursor: grabbing; }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        .sheet-title {
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            padding: 12px 0 20px;
        }

        /* Forms */
        .form-group { margin-bottom: 14px; }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #2c2c2e;
            color: #fff;
            font-size: 1rem;
            -webkit-appearance: none;
        }

        .form-input:focus {
            outline: none;
            border-color: #30d158;
        }

        .form-input::placeholder { color: rgba(255,255,255,0.22); }

        /* Child Book Form */
        .child-book-form {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .child-book-form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .child-book-form-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.38);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .child-book-form-remove {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(255,255,255,0.3);
            font-size: 1rem;
            padding: 2px 4px;
            transition: color 0.2s;
            line-height: 1;
        }

        .child-book-form-remove:hover { color: #ff453a; }

        .child-book-form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 8px;
        }

        @media (max-width: 480px) {
            .child-book-form-row { grid-template-columns: 1fr 1fr; }
            .child-book-form-row .form-group:first-child { grid-column: 1 / -1; }
        }

        .child-book-form-row .form-group { margin-bottom: 0; }

        .child-books-list { margin-bottom: 12px; }

        .add-child-btn {
            width: 100%;
            padding: 11px;
            border: 1.5px dashed rgba(255,255,255,0.16);
            background: transparent;
            color: rgba(255,255,255,0.4);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .add-child-btn:hover {
            border-color: rgba(255,255,255,0.32);
            color: rgba(255,255,255,0.75);
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 10px;
            padding: 16px 0 4px;
        }

        .btn {
            flex: 1;
            padding: 13px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: opacity 0.15s;
        }

        .btn:active { opacity: 0.7; }
        .btn-primary { background: #30d158; color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.12); color: #fff; }
        .btn-danger { background: #ff453a; color: #fff; }

        /* Action Sheet Options */
        .action-sheet-options { padding: 4px 0 8px; }

        .action-sheet-btn {
            width: 100%;
            padding: 15px 16px;
            background: #2c2c2e;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.15s;
        }

        .action-sheet-btn:active { opacity: 0.7; }
        .action-sheet-btn.danger { color: #ff453a; }
        .action-sheet-btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }

        .action-sheet-cancel {
            width: 100%;
            padding: 15px;
            background: #2c2c2e;
            border: none;
            color: rgba(255,255,255,0.55);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            border-radius: 12px;
            margin-top: 4px;
            transition: opacity 0.15s;
        }

        .action-sheet-cancel:active { opacity: 0.7; }

        /* Confirm Sheet */
        .confirm-message {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.6);
            text-align: center;
            line-height: 1.5;
            padding-bottom: 20px;
        }

        /* Settings Sheet */
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #2c2c2e;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            border: none;
            width: 100%;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 400;
            transition: opacity 0.15s;
            text-align: left;
        }

        .settings-row:active { opacity: 0.7; }

        .settings-row-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-row-label svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
        .settings-row-danger { color: #ff453a; }

        .settings-toggle {
            position: relative;
            width: 44px;
            height: 26px;
            border-radius: 13px;
            background: rgba(255,255,255,0.16);
            transition: background 0.2s ease;
            flex-shrink: 0;
        }

        .settings-toggle.on { background: #30d158; }

        .settings-toggle-knob {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s ease;
        }

        .settings-toggle.on .settings-toggle-knob { transform: translateX(18px); }

        .settings-row-chevron {
            width: 14px;
            height: 14px;
            fill: rgba(255,255,255,0.28);
            flex-shrink: 0;
        }

        .version-text {
            text-align: center;
            color: rgba(255,255,255,0.2);
            font-size: 0.78rem;
            margin-top: 20px;
            padding-bottom: 8px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            display: block;
        }

        .empty-state-text {
            font-size: 1.05rem;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 0.875rem;
            color: rgba(255,255,255,0.28);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1>OmniTrack</h1>
            <button class="settings-btn" onclick="showSettingsSheet()" title="Settings">
                <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/></svg>
            </button>
        </div>
        <div id="omnibus-list"></div>
    </div>

    <!-- Bottom Toolbar -->
    <div class="bottom-toolbar">
        <button class="toolbar-btn-import" onclick="importOmnibusFile()">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg>
            Import Book
        </button>
        <button class="toolbar-btn-new" onclick="showCreateSheet()">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            New Omnibus
        </button>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="import-omnibus-file" accept=".json" style="display:none" onchange="handleOmnibusImport(event)">
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

    <!-- Omnibus create/edit sheet -->
    <div class="sheet-overlay" id="omnibus-overlay" onclick="hideOmnibusSheet()"></div>
    <div class="sheet" id="omnibus-sheet">
        <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
        <div class="sheet-title" id="omnibus-sheet-title">New Omnibus</div>
        <form id="omnibus-form" onsubmit="saveOmnibus(event)">
            <input type="hidden" id="omnibus-id">
            <div class="form-group">
                <label class="form-label" for="omnibus-name">Name</label>
                <input type="text" class="form-input" id="omnibus-name" placeholder="e.g., The Lord of the Rings" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="omnibus-pages">Total Pages</label>
                <input type="number" class="form-input" id="omnibus-pages" placeholder="e.g., 1200" min="1" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="omnibus-percent">Percent Completed</label>
                <input type="number" class="form-input" id="omnibus-percent" placeholder="0" min="0" max="100" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Contains</label>
                <div id="child-books-form-list" class="child-books-list"></div>
                <button type="button" class="add-child-btn" onclick="addChildBookForm()">+ Add Book</button>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="hideOmnibusSheet()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>

    <!-- Child book edit sheet -->
    <div class="sheet-overlay" id="child-overlay" onclick="hideChildSheet()"></div>
    <div class="sheet" id="child-sheet">
        <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
        <div class="sheet-title">Edit Book</div>
        <form id="child-form" onsubmit="saveChildBook(event)">
            <input type="hidden" id="child-omnibus-id">
            <input type="hidden" id="child-book-index">
            <div class="form-group">
                <label class="form-label" for="child-name">Name</label>
                <input type="text" class="form-input" id="child-name" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="child-series">Series Number</label>
                <input type="number" class="form-input" id="child-series" min="1" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="child-start">Start Page</label>
                <input type="number" class="form-input" id="child-start" min="1" required>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="hideChildSheet()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>

    <!-- Confirm sheet -->
    <div class="sheet-overlay" id="confirm-overlay" onclick="hideConfirmSheet()"></div>
    <div class="sheet" id="confirm-sheet">
        <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
        <div class="sheet-title" id="confirm-title">Confirm</div>
        <p class="confirm-message" id="confirm-text"></p>
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="hideConfirmSheet()">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-btn" onclick="confirmAction()">Delete</button>
        </div>
    </div>

    <!-- Card action sheet -->
    <div class="sheet-overlay" id="actions-overlay" onclick="hideActionsSheet()"></div>
    <div class="sheet" id="actions-sheet">
        <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
        <div class="action-sheet-options">
            <button class="action-sheet-btn" onclick="editOmnibusFromActions()">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                Edit
            </button>
            <button class="action-sheet-btn danger" onclick="deleteOmnibusFromActions()">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                Delete
            </button>
        </div>
        <button class="action-sheet-cancel" onclick="hideActionsSheet()">Cancel</button>
    </div>

    <!-- Settings sheet -->
    <div class="sheet-overlay" id="settings-overlay" onclick="hideSettingsSheet()"></div>
    <div class="sheet" id="settings-sheet">
        <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
        <div class="sheet-title">Settings</div>
        <button class="settings-row" onclick="exportData()">
            <span class="settings-row-label">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg>
                Export Data
            </span>
            <svg class="settings-row-chevron" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
        <button class="settings-row" onclick="importData()">
            <span class="settings-row-label">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                Import Data
            </span>
            <svg class="settings-row-chevron" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
        <button class="settings-row" id="sound-row" onclick="toggleSound()" role="switch" aria-checked="true">
            <span class="settings-row-label">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                Completion Chime
            </span>
            <span class="settings-toggle" id="sound-toggle"><span class="settings-toggle-knob"></span></span>
        </button>
        <button class="settings-row settings-row-danger" onclick="resetData()">
            <span class="settings-row-label">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                Reset All Data
            </span>
            <svg class="settings-row-chevron" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
        <div class="version-text">Version 1.0.14</div>
    </div>

    <script>
        const STORAGE_KEY = 'omnitrack_data';
        const UI_STATE_KEY = 'omnitrack_ui_state';
        const SOUND_KEY = 'omnitrack_sound';
        let omnibusBooks = [];
        let confirmCallback = null;
        let collapsedState = {};
        let activeOmnibusId = null;
        let pendingUpdateReload = false;
        let soundEnabled = true;
        let audioCtx = null;

        function loadUIState() {
            try {
                const data = localStorage.getItem(UI_STATE_KEY);
                const parsed = data ? JSON.parse(data) : null;
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) collapsedState = parsed;
            } catch (e) {
                console.warn('Ignoring corrupt UI state:', e);
                collapsedState = {};
            }
        }

        function saveUIState() {
            try {
                localStorage.setItem(UI_STATE_KEY, JSON.stringify(collapsedState));
            } catch (e) {
                console.warn('Could not save UI state:', e);
            }
        }

        function loadSoundSetting() {
            try {
                soundEnabled = localStorage.getItem(SOUND_KEY) !== 'off';
            } catch (e) {
                soundEnabled = true;
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            try {
                localStorage.setItem(SOUND_KEY, soundEnabled ? 'on' : 'off');
            } catch (e) {
                console.warn('Could not save sound setting:', e);
            }
            renderSoundToggle();
            // Preview the sound, which also unlocks the audio context on iOS:
            // it can only start from inside a user gesture, and this tap is one.
            if (soundEnabled) playCompletionChime();
        }

        function renderSoundToggle() {
            document.getElementById('sound-toggle').classList.toggle('on', soundEnabled);
            document.getElementById('sound-row').setAttribute('aria-checked', String(soundEnabled));
        }

        // A short two-note chime, synthesized rather than loaded, so there is no
        // audio file to ship or cache. Audio is a nicety: every failure here is
        // swallowed so it can never interfere with recording progress.
        // Note that iOS silences Web Audio when the ring/silent switch is set to
        // silent, so this is a bonus cue and not a dependable signal.
        function playCompletionChime() {
            if (!soundEnabled) return;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                audioCtx = audioCtx || new Ctx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                [[880, 0], [1318.5, 0.12]].forEach(([frequency, offset]) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = frequency;
                    // Ramp the gain: starting and stopping at full volume clicks.
                    gain.gain.setValueAtTime(0.0001, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.18, now + offset + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 0.25);
                });
            } catch (e) {
                console.warn('Could not play chime:', e);
            }
        }

        // How many child books are finished. Compared before and after a progress
        // change to decide whether one has just been completed.
        function completedChildCount(omnibus) {
            if (!omnibus || !Array.isArray(omnibus.books)) return 0;
            return calculateChildBookProperties(omnibus).filter(c => c.percentRead >= 100).length;
        }

        function toggleCollapse(id) {
            const collapsed = !collapsedState[id];
            collapsedState[id] = collapsed;
            saveUIState();
            const card = findCard(id);
            if (!card) { render(); return; }
            const panel = card.querySelector('.child-books-content');
            const chevron = card.querySelector('.collapse-chevron');
            if (!panel || !chevron) { render(); return; }
            chevron.classList.toggle('collapsed', collapsed);
            if (collapsed) {
                // Give the panel a concrete height to animate away from, and flush
                // it to the style system before the class pins max-height to 0.
                panel.style.maxHeight = panel.scrollHeight + 'px';
                void panel.offsetHeight;
                panel.classList.add('collapsed');
            } else {
                // Measure while still collapsed — scrollHeight reports content
                // height regardless of max-height — so the class removal and the
                // fresh target land together as one 0 -> height change. Removing
                // the class first would briefly restore a stale (or cleared)
                // inline value and animate towards the wrong height.
                const target = panel.scrollHeight;
                panel.classList.remove('collapsed');
                panel.style.maxHeight = target + 'px';
            }
        }

        function loadData() {
            // Tolerate corrupt storage so the app still starts (and Settings
            // remains reachable) instead of dying on an unhandled parse error.
            let parsed = null;
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                parsed = data ? JSON.parse(data) : null;
            } catch (e) {
                console.warn('Ignoring corrupt stored data:', e);
                return;
            }
            if (!Array.isArray(parsed)) {
                if (parsed !== null) console.warn('Ignoring stored data: not an array');
                return;
            }
            // Stored records get the same shape check as imported ones. A
            // malformed record (an older format, a hand-edited backup, a partial
            // write) would otherwise throw inside render() and leave the whole
            // list blank with no explanation. Unreadable records are left out of
            // memory but not erased from storage, so nothing is destroyed here.
            omnibusBooks = parsed.filter(isValidOmnibus);
            omnibusBooks.forEach(o => { o.percentCompleted = clampPercent(o.percentCompleted); });
            const dropped = parsed.length - omnibusBooks.length;
            if (dropped > 0) {
                console.warn(`Ignoring ${dropped} malformed stored omnibus record(s)`);
                setTimeout(() => alert(
                    `${dropped} saved omnibus book(s) could not be read and are not shown.\n\n` +
                    'Your stored data has not been changed yet, but saving any edit will discard them. ' +
                    'Restore from a backup first if you need them.'), 0);
            }
        }

        function clampPercent(value) {
            const n = Number(value);
            return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0;
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(omnibusBooks));
            } catch (e) {
                // e.g. QuotaExceededError, or Safari private browsing
                alert('Could not save your changes — storage is full or unavailable.\n\n' + e.message);
                return false;
            }
            // Prune collapse state for omnibuses that no longer exist so the
            // UI-state entry doesn't accumulate stale ids forever.
            const ids = new Set(omnibusBooks.map(o => o.id));
            let pruned = false;
            for (const key of Object.keys(collapsedState)) {
                if (!ids.has(key)) { delete collapsedState[key]; pruned = true; }
            }
            if (pruned) saveUIState();
            return true;
        }

        // Runs a mutation and persists it. If persistence fails, the in-memory
        // state is rolled back so the UI can never show a change that wasn't
        // actually saved. Returns whether the change stuck.
        function commitChange(mutate) {
            const snapshot = JSON.stringify(omnibusBooks);
            mutate();
            const saved = saveData();
            if (!saved) {
                try {
                    omnibusBooks = JSON.parse(snapshot);
                } catch (e) {
                    omnibusBooks = [];
                    loadData();
                }
            }
            render();
            return saved;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        function calculatePagesRead(omnibus) {
            return Math.round((omnibus.percentCompleted / 100) * omnibus.pageCount);
        }

        function calculateChildBookProperties(omnibus) {
            const sortedBooks = omnibus.books
                .map((book, originalIndex) => ({ book, originalIndex }))
                .sort((a, b) => a.book.seriesNumber - b.book.seriesNumber);
            const pagesRead = calculatePagesRead(omnibus);
            return sortedBooks.map(({ book, originalIndex }, index) => {
                const endPage = index === sortedBooks.length - 1
                    ? omnibus.pageCount
                    : sortedBooks[index + 1].book.startPage - 1;
                const totalPages = Math.max(0, endPage - book.startPage + 1);
                const percentOfBook = omnibus.pageCount > 0 ? (totalPages / omnibus.pageCount) * 100 : 0;
                let childPagesRead;
                if (pagesRead >= endPage) childPagesRead = totalPages;
                else if (pagesRead < book.startPage) childPagesRead = 0;
                else childPagesRead = Math.min(totalPages, pagesRead - book.startPage + 1);
                const percentRead = childPagesRead <= 0 || totalPages <= 0
                    ? 0
                    : Math.min(100, (childPagesRead / totalPages) * 100);
                return { ...book, originalIndex, endPage, totalPages, percentOfBook, pagesRead: childPagesRead, percentRead };
            });
        }

        // Returns an error message string if the child books' series numbers are
        // not unique, or their start pages are not strictly increasing in series
        // order (or exceed the omnibus page count), otherwise null. Out-of-order
        // pages would yield negative page ranges.
        function validateChildPages(books, pageCount) {
            const sorted = [...books].sort((a, b) => a.seriesNumber - b.seriesNumber);
            let prev = 0;
            let prevSeries = null;
            for (const b of sorted) {
                if (b.seriesNumber === prevSeries) {
                    return `Two books share series number ${b.seriesNumber} ("${b.name}"). Each book needs its own number.`;
                }
                if (b.startPage > pageCount) {
                    return `Start page ${b.startPage} for "${b.name}" exceeds the total page count (${pageCount}).`;
                }
                if (b.startPage <= prev) {
                    return `Start pages must increase in series order. "${b.name}" (page ${b.startPage}) does not come after the previous book.`;
                }
                prev = b.startPage;
                prevSeries = b.seriesNumber;
            }
            return null;
        }

        function isPositiveNumber(n) {
            return typeof n === 'number' && Number.isFinite(n) && n > 0;
        }

        // Validates one omnibus record's shape. Shared by the import and load
        // paths so stored data can never be less trusted — or less checked —
        // than imported data.
        function isValidOmnibus(o) {
            return !!o && typeof o === 'object' &&
                typeof o.name === 'string' &&
                isPositiveNumber(o.pageCount) &&
                typeof o.percentCompleted === 'number' && Number.isFinite(o.percentCompleted) &&
                Array.isArray(o.books) &&
                o.books.every(b =>
                    !!b && typeof b === 'object' &&
                    typeof b.name === 'string' &&
                    typeof b.seriesNumber === 'number' && Number.isFinite(b.seriesNumber) &&
                    isPositiveNumber(b.startPage)
                );
        }

        // Validates that imported data is an array of well-formed omnibus objects.
        function isValidOmnibusArray(data) {
            return Array.isArray(data) && data.every(isValidOmnibus);
        }

        // Normalizes an imported omnibus to the app's invariants: clamps
        // percentCompleted to 0-100 and returns a page-order error (or null)
        // so full-backup imports enforce the same rules as manual entry.
        function normalizeImportedOmnibus(o) {
            o.percentCompleted = clampPercent(o.percentCompleted);
            return validateChildPages(o.books, o.pageCount);
        }

        function render() {
            const container = document.getElementById('omnibus-list');
            if (omnibusBooks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-state-icon">📚</span>
                        <div class="empty-state-text">No omnibus books yet</div>
                        <div class="empty-state-subtext">Tap New Omnibus to get started</div>
                    </div>`;
                return;
            }
            container.innerHTML = omnibusBooks.map(omnibus => {
                const pagesRead = calculatePagesRead(omnibus);
                const childBooks = calculateChildBookProperties(omnibus);
                const chevronClass = collapsedState[omnibus.id] ? 'collapsed' : '';
                return `
                    <div class="omnibus-card" data-id="${escapeHtml(omnibus.id)}">
                        <div class="omnibus-header">
                            <div class="omnibus-title">${escapeHtml(omnibus.name)}</div>
                            <button class="omnibus-menu-btn" onclick="showActionsSheet('${omnibus.id}')" title="More options">
                                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                            </button>
                        </div>
                        <div class="omnibus-meta">${omnibusMetaText(omnibus, pagesRead)}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${clampPercent(omnibus.percentCompleted)}%"></div>
                        </div>
                        <div class="progress-controls">
                            <button class="progress-btn" onclick="adjustProgress('${omnibus.id}', -1)">−</button>
                            <div class="progress-value">${omnibus.percentCompleted}%</div>
                            <button class="progress-btn" onclick="adjustProgress('${omnibus.id}', 1)">+</button>
                        </div>
                        ${childBooks.length > 0 ? `
                            <div class="child-books">
                                <div class="child-books-header" onclick="toggleCollapse('${omnibus.id}')">
                                    <div class="child-books-title">Contains (${childBooks.length})</div>
                                    <span class="collapse-chevron ${chevronClass}">
                                        <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                                    </span>
                                </div>
                                <div class="child-books-content ${chevronClass}">
                                ${childBooks.map(child => `
                                    <div class="child-book">
                                        <div class="child-book-header">
                                            <div>
                                                <div class="child-book-name">${child.seriesNumber}. ${escapeHtml(child.name)}</div>
                                                <div class="child-book-meta">${escapeHtml(childMetaText(child))}</div>
                                            </div>
                                            <button class="child-book-edit-btn" onclick="editChildBook('${omnibus.id}', ${child.originalIndex})" title="Edit">
                                                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                            </button>
                                        </div>
                                        <div class="progress-bar child-progress-bar">
                                            <div class="progress-fill child" style="width: ${clampPercent(child.percentRead)}%"></div>
                                        </div>
                                    </div>
                                `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>`;
            }).join('');
            sizeChildPanels();
        }

        function omnibusMetaText(omnibus, pagesRead) {
            return `${pagesRead.toLocaleString()} of ${Number(omnibus.pageCount).toLocaleString()} pages`;
        }

        function childMetaText(child) {
            return `Pages ${child.startPage}–${child.endPage} · ${child.pagesRead}/${child.totalPages} read · ${Math.round(child.percentRead)}%`;
        }

        function findCard(id) {
            return Array.from(document.querySelectorAll('.omnibus-card')).find(el => el.dataset.id === id) || null;
        }

        // Updates one card's progress figures in place. Replacing the whole list
        // with innerHTML would swap in fresh nodes that render at their final
        // width, so the progress-bar transition would never run.
        function updateOmnibusCard(omnibus) {
            const card = findCard(omnibus.id);
            if (!card) { render(); return; }
            const pagesRead = calculatePagesRead(omnibus);
            card.querySelector('.omnibus-meta').textContent = omnibusMetaText(omnibus, pagesRead);
            card.querySelector('.progress-value').textContent = `${omnibus.percentCompleted}%`;
            card.querySelector('.progress-fill:not(.child)').style.width = clampPercent(omnibus.percentCompleted) + '%';
            const children = calculateChildBookProperties(omnibus);
            card.querySelectorAll('.child-book').forEach((el, i) => {
                const child = children[i];
                if (!child) return;
                el.querySelector('.child-book-meta').textContent = childMetaText(child);
                el.querySelector('.progress-fill.child').style.width = clampPercent(child.percentRead) + '%';
            });
            // A changed label can rewrap and alter the height an expanded panel needs.
            sizeChildPanels();
        }

        // Size each expanded panel to its actual content so long, wrapping titles
        // are never clipped by the overflow:hidden container. Re-run on resize
        // because a width change can rewrap titles and change the needed height.
        function sizeChildPanels() {
            document.querySelectorAll('.child-books-content').forEach(el => {
                el.style.maxHeight = el.classList.contains('collapsed') ? '' : el.scrollHeight + 'px';
            });
        }

        // Escapes text for safe interpolation into HTML — including quotes, so
        // it is safe in double- and single-quoted attribute values (e.g. the
        // value="..." inputs in addChildBookForm), not just element content.
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return String(text).replace(/[&<>"']/g, c => map[c]);
        }

        function adjustProgress(id, increment) {
            const omnibus = omnibusBooks.find(o => o.id === id);
            if (!omnibus) return;
            const previous = omnibus.percentCompleted;
            const next = clampPercent(previous + increment);
            if (next === previous) return;
            const completedBefore = completedChildCount(omnibus);
            omnibus.percentCompleted = next;
            // Roll back rather than leave the screen showing an unsaved value.
            const saved = saveData();
            if (!saved) omnibus.percentCompleted = previous;
            updateOmnibusCard(omnibus);
            // Only a progress tap chimes, and only for a change that stuck: this
            // handler runs from the button's click, which is the user gesture iOS
            // requires before it will play anything.
            if (saved && completedChildCount(omnibus) > completedBefore) playCompletionChime();
        }

        // Sheet helpers
        const pendingSheetHides = new Map();

        function cancelPendingHide(sheetId) {
            const timer = pendingSheetHides.get(sheetId);
            if (timer === undefined) return;
            clearTimeout(timer);
            pendingSheetHides.delete(sheetId);
            const sheet = document.getElementById(sheetId);
            sheet.style.transition = '';
            sheet.style.transform = '';
        }

        function showSheet(overlayId, sheetId) {
            cancelPendingHide(sheetId);
            document.getElementById(overlayId).classList.add('visible');
            document.getElementById(sheetId).classList.add('visible');
        }

        function hideSheet(overlayId, sheetId) {
            document.getElementById(overlayId).classList.remove('visible');
            document.getElementById(sheetId).classList.remove('visible');
            // A service-worker update that arrived mid-edit waits for the sheet
            // to close before reloading, so it can't discard what was typed.
            if (pendingUpdateReload) {
                pendingUpdateReload = false;
                window.location.reload();
            }
        }

        // Omnibus sheet
        function showCreateSheet() {
            document.getElementById('omnibus-sheet-title').textContent = 'New Omnibus';
            document.getElementById('omnibus-id').value = '';
            document.getElementById('omnibus-name').value = '';
            document.getElementById('omnibus-pages').value = '';
            document.getElementById('omnibus-percent').value = '0';
            document.getElementById('child-books-form-list').innerHTML = '';
            showSheet('omnibus-overlay', 'omnibus-sheet');
            setTimeout(() => document.getElementById('omnibus-name').focus(), 350);
        }

        function hideOmnibusSheet() { hideSheet('omnibus-overlay', 'omnibus-sheet'); }

        // Actions sheet
        function showActionsSheet(id) {
            activeOmnibusId = id;
            showSheet('actions-overlay', 'actions-sheet');
        }

        function hideActionsSheet() {
            hideSheet('actions-overlay', 'actions-sheet');
            activeOmnibusId = null;
        }

        function editOmnibusFromActions() {
            const id = activeOmnibusId;
            hideActionsSheet();
            setTimeout(() => editOmnibus(id), 50);
        }

        function deleteOmnibusFromActions() {
            const id = activeOmnibusId;
            hideActionsSheet();
            setTimeout(() => deleteOmnibus(id), 50);
        }

        // Child sheet
        function hideChildSheet() { hideSheet('child-overlay', 'child-sheet'); }

        // Confirm sheet
        function hideConfirmSheet() {
            hideSheet('confirm-overlay', 'confirm-sheet');
            confirmCallback = null;
        }

        // Settings sheet
        function showSettingsSheet() { showSheet('settings-overlay', 'settings-sheet'); }
        function hideSettingsSheet() { hideSheet('settings-overlay', 'settings-sheet'); }

        function exportData() {
            const data = JSON.stringify(omnibusBooks, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            a.href = url;
            a.download = `omnitrack-export-${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importOmnibusFile() {
            document.getElementById('import-omnibus-file').click();
        }

        // Reads the chosen file, parses JSON, and hands the result to onData.
        // Clears the input so re-selecting the same file fires onchange again.
        function readJsonFile(event, onData) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                let data;
                try {
                    data = JSON.parse(e.target.result);
                } catch (err) {
                    alert('Failed to parse file: ' + err.message);
                    return;
                }
                onData(data);
            };
            reader.onerror = () => alert('Could not read that file. Please try again.');
            reader.readAsText(file);
        }

        // A top-level array is a full backup (export); anything else is treated
        // as a single ebook-derived omnibus. Both import buttons route through
        // this, so either kind of file works from either entry point.
        function routeImport(data) {
            if (Array.isArray(data)) importFullBackup(data);
            else importSingleOmnibus(data);
        }

        function handleOmnibusImport(event) {
            readJsonFile(event, routeImport);
        }

        // Appends a single ebook-derived omnibus to the existing data.
        function importSingleOmnibus(data) {
            if (!data || typeof data !== 'object' ||
                typeof data.omnibus_title !== 'string' || !data.omnibus_title.trim() ||
                !isPositiveNumber(data.total_pages) || !Array.isArray(data.child_books)) {
                alert('Unrecognized file format.\n\nExpected either a full OmniTrack backup (an export file) or a single book file with omnibus_title, total_pages, and child_books.');
                return;
            }
            const validChildren = data.child_books.every(book =>
                book && typeof book === 'object' &&
                typeof book.title === 'string' &&
                typeof book.start_page === 'number'
            );
            if (!validChildren) {
                alert('Invalid book file: each entry in child_books must have a title and a numeric start_page.');
                return;
            }
            const books = data.child_books.map((book, index) => ({
                name: book.title,
                seriesNumber: index + 1,
                startPage: book.start_page
            }));
            const pageError = validateChildPages(books, data.total_pages);
            if (pageError) { alert(pageError); return; }
            commitChange(() => omnibusBooks.push({
                id: generateId(),
                name: data.omnibus_title.trim(),
                pageCount: data.total_pages,
                percentCompleted: 0,
                books
            }));
        }

        function importData() {
            document.getElementById('import-file').click();
        }

        function handleImport(event) {
            readJsonFile(event, routeImport);
        }

        // Replaces all data with a validated full-backup array, confirming first
        // if there is existing data to overwrite.
        function importFullBackup(data) {
            if (!isValidOmnibusArray(data)) {
                alert('This file is a list, so it was read as a full OmniTrack backup, but its contents are not valid OmniTrack data.');
                return;
            }
            if (data.length === 0) {
                alert('This backup file is empty — nothing to import.');
                return;
            }
            // Enforce the same page-order / range invariants as manual entry so a
            // hand-edited or corrupt backup can't reintroduce negative page ranges.
            for (const o of data) {
                const pageError = normalizeImportedOmnibus(o);
                if (pageError) {
                    alert(`Can't import "${o.name}": ${pageError}`);
                    return;
                }
            }
            // Regenerate ids so imported data can never inject markup through
            // the id values interpolated into inline event handlers.
            const doImport = () => commitChange(() => {
                omnibusBooks = data.map(o => ({ ...o, id: generateId() }));
            });
            hideSettingsSheet();
            if (omnibusBooks.length > 0) {
                document.getElementById('confirm-title').textContent = 'Replace All Data';
                document.getElementById('confirm-text').textContent =
                    `This will replace your current ${omnibusBooks.length} omnibus book(s) with ${data.length} from the file. This cannot be undone.`;
                document.getElementById('confirm-btn').textContent = 'Replace';
                confirmCallback = doImport;
                setTimeout(() => showSheet('confirm-overlay', 'confirm-sheet'), 50);
            } else {
                doImport();
            }
        }

        function resetData() {
            hideSettingsSheet();
            document.getElementById('confirm-title').textContent = 'Reset All Data';
            document.getElementById('confirm-text').textContent = 'Are you sure you want to delete all omnibus books? This cannot be undone.';
            document.getElementById('confirm-btn').textContent = 'Reset';
            confirmCallback = () => commitChange(() => { omnibusBooks = []; });
            showSheet('confirm-overlay', 'confirm-sheet');
        }

        // Child book form
        let childFormCounter = 0;
        function addChildBookForm(name = '', seriesNumber = '', startPage = '', focusName = true) {
            const list = document.getElementById('child-books-form-list');
            const id = childFormCounter++;
            const div = document.createElement('div');
            div.className = 'child-book-form';
            div.id = `child-form-${id}`;
            div.innerHTML = `
                <div class="child-book-form-header">
                    <span class="child-book-form-title">Book</span>
                    <button type="button" class="child-book-form-remove" onclick="removeChildBookForm(${id})">✕</button>
                </div>
                <div class="child-book-form-row">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-input child-name" value="${escapeHtml(name)}" placeholder="Book name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Series #</label>
                        <input type="number" class="form-input child-series" value="${seriesNumber}" placeholder="#" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Start Page</label>
                        <input type="number" class="form-input child-start" value="${startPage}" placeholder="Page" min="1" required>
                    </div>
                </div>`;
            list.appendChild(div);
            div.querySelectorAll('.form-input').forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); addChildBookForm(); }
                });
            });
            if (focusName) div.querySelector('.child-name').focus();
        }

        function removeChildBookForm(id) {
            document.getElementById(`child-form-${id}`)?.remove();
        }

        function saveOmnibus(event) {
            event.preventDefault();
            const id = document.getElementById('omnibus-id').value;
            const name = document.getElementById('omnibus-name').value.trim();
            const pageCount = parseInt(document.getElementById('omnibus-pages').value);
            const percentCompleted = parseInt(document.getElementById('omnibus-percent').value) || 0;
            if (!name || !isPositiveNumber(pageCount)) {
                alert('Enter a name and a total page count of at least 1.');
                return;
            }
            const books = [];
            let incomplete = false;
            document.querySelectorAll('#child-books-form-list .child-book-form').forEach(form => {
                const childName = form.querySelector('.child-name').value.trim();
                const seriesRaw = form.querySelector('.child-series').value.trim();
                const startRaw = form.querySelector('.child-start').value.trim();
                // An untouched row (from a stray "+ Add Book") is fine to ignore;
                // a partly filled one is a mistake, not something to discard.
                if (!childName && !seriesRaw && !startRaw) return;
                const seriesNumber = parseInt(seriesRaw);
                const startPage = parseInt(startRaw);
                if (!childName || isNaN(seriesNumber) || isNaN(startPage)) { incomplete = true; return; }
                books.push({ name: childName, seriesNumber, startPage });
            });
            if (incomplete) {
                alert('Every book needs a name, a series number, and a start page.\n\nFill in the missing fields, or remove the book with its ✕ button.');
                return;
            }
            books.sort((a, b) => a.seriesNumber - b.seriesNumber);
            const pageError = validateChildPages(books, pageCount);
            if (pageError) { alert(pageError); return; }
            const percent = clampPercent(percentCompleted);
            let saved;
            if (id) {
                const omnibus = omnibusBooks.find(o => o.id === id);
                if (!omnibus) { hideOmnibusSheet(); return; }
                saved = commitChange(() => {
                    omnibus.name = name;
                    omnibus.pageCount = pageCount;
                    omnibus.percentCompleted = percent;
                    omnibus.books = books;
                });
            } else {
                saved = commitChange(() => {
                    omnibusBooks.push({ id: generateId(), name, pageCount, percentCompleted: percent, books });
                });
            }
            // On a failed save the change has been rolled back, so keep the sheet
            // open rather than closing it over work that was not kept.
            if (saved) hideOmnibusSheet();
        }

        function editOmnibus(id) {
            const omnibus = omnibusBooks.find(o => o.id === id);
            if (!omnibus) return;
            document.getElementById('omnibus-sheet-title').textContent = 'Edit Omnibus';
            document.getElementById('omnibus-id').value = omnibus.id;
            document.getElementById('omnibus-name').value = omnibus.name;
            document.getElementById('omnibus-pages').value = omnibus.pageCount;
            document.getElementById('omnibus-percent').value = omnibus.percentCompleted;
            const list = document.getElementById('child-books-form-list');
            list.innerHTML = '';
            childFormCounter = 0;
            omnibus.books.forEach(book => addChildBookForm(book.name, book.seriesNumber, book.startPage, false));
            showSheet('omnibus-overlay', 'omnibus-sheet');
        }

        function deleteOmnibus(id) {
            const omnibus = omnibusBooks.find(o => o.id === id);
            if (!omnibus) return;
            document.getElementById('confirm-title').textContent = 'Delete Omnibus';
            document.getElementById('confirm-text').textContent = `Delete "${omnibus.name}" and all its books?`;
            document.getElementById('confirm-btn').textContent = 'Delete';
            confirmCallback = () => commitChange(() => {
                omnibusBooks = omnibusBooks.filter(o => o.id !== id);
            });
            showSheet('confirm-overlay', 'confirm-sheet');
        }

        function editChildBook(omnibusId, bookIndex) {
            const omnibus = omnibusBooks.find(o => o.id === omnibusId);
            if (!omnibus) return;
            const child = omnibus.books[bookIndex];
            if (!child) return;
            document.getElementById('child-omnibus-id').value = omnibusId;
            document.getElementById('child-book-index').value = bookIndex;
            document.getElementById('child-name').value = child.name;
            document.getElementById('child-series').value = child.seriesNumber;
            document.getElementById('child-start').value = child.startPage;
            showSheet('child-overlay', 'child-sheet');
        }

        function saveChildBook(event) {
            event.preventDefault();
            const omnibusId = document.getElementById('child-omnibus-id').value;
            const childIndex = parseInt(document.getElementById('child-book-index').value);
            const omnibus = omnibusBooks.find(o => o.id === omnibusId);
            if (!omnibus || childIndex < 0 || childIndex >= omnibus.books.length) return;
            const updated = omnibus.books.map((b, i) => i === childIndex ? {
                name: document.getElementById('child-name').value.trim(),
                seriesNumber: parseInt(document.getElementById('child-series').value),
                startPage: parseInt(document.getElementById('child-start').value)
            } : b);
            const pageError = validateChildPages(updated, omnibus.pageCount);
            if (pageError) { alert(pageError); return; }
            if (commitChange(() => { omnibus.books = updated; })) hideChildSheet();
        }

        function confirmAction() {
            if (confirmCallback) confirmCallback();
            hideConfirmSheet();
        }

        function generateAppIcon() {
            const SIZE = 180;
            const canvas = document.createElement('canvas');
            canvas.width = SIZE; canvas.height = SIZE;
            const ctx = canvas.getContext('2d');

            // Background (iOS rounds the corners automatically, but rounding here
            // keeps the favicon/browser tab look consistent with the home screen)
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.roundRect(0, 0, SIZE, SIZE, 40); ctx.fill();

            const TRACK = 'rgba(255,255,255,0.14)';
            const FILL = '#30d158';

            // Layout
            const barX = 26;
            const barW = SIZE - barX * 2;          // 128px
            const omniH = 18;
            const childH = 12;
            const childGap = 10;
            const omniGap = 22;
            const childCount = 4;
            const totalH = omniH + omniGap + childCount * childH + (childCount - 1) * childGap;
            const startY = (SIZE - totalH) / 2;

            // Child book progress values (0..1). These also drive the omnibus fill.
            const children = [1.0, 1.0, 0.62, 0.0];
            const omniProgress = children.reduce((a, b) => a + b, 0) / children.length;

            const drawBar = (x, y, w, h, progress) => {
                const r = h / 2;
                // Track
                ctx.fillStyle = TRACK;
                ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
                // Fill
                if (progress > 0) {
                    const fw = Math.max(h, w * progress); // keep fill at least as wide as height so the rounded cap renders cleanly
                    ctx.fillStyle = FILL;
                    ctx.beginPath(); ctx.roundRect(x, y, fw, h, r); ctx.fill();
                }
            };

            // Omnibus bar
            drawBar(barX, startY, barW, omniH, omniProgress);

            // Child bars
            let y = startY + omniH + omniGap;
            for (let i = 0; i < childCount; i++) {
                drawBar(barX, y, barW, childH, children[i]);
                y += childH + childGap;
            }

            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('app-icon').href = dataUrl;
            document.getElementById('favicon').href = dataUrl;
        }

        function initDraggableSheet(sheetId, hideFunc) {
            const sheet = document.getElementById(sheetId);
            const handle = sheet.querySelector('.sheet-handle-row');
            let startY = 0, dragY = 0, dragging = false;

            handle.addEventListener('pointerdown', (e) => {
                startY = e.clientY;
                dragY = 0;
                dragging = true;
                sheet.style.transition = 'none';
                handle.setPointerCapture(e.pointerId);
            });

            handle.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                dragY = Math.max(0, e.clientY - startY);
                sheet.style.transform = `translateX(-50%) translateY(${dragY}px)`;
            });

            const endDrag = (dismiss) => {
                if (!dragging) return;
                dragging = false;
                if (dismiss) {
                    sheet.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
                    sheet.style.transform = 'translateX(-50%) translateY(100%)';
                    pendingSheetHides.set(sheetId, setTimeout(() => {
                        pendingSheetHides.delete(sheetId);
                        sheet.style.transition = '';
                        sheet.style.transform = '';
                        hideFunc();
                    }, 300));
                } else {
                    sheet.style.transition = 'transform 0.35s cubic-bezier(0.32, 0.72, 0, 1)';
                    sheet.style.transform = 'translateX(-50%) translateY(0)';
                    setTimeout(() => { sheet.style.transition = ''; sheet.style.transform = ''; }, 350);
                }
            };

            handle.addEventListener('pointerup', () => endDrag(dragY > 80));
            // If the gesture is interrupted (e.g. by the system), snap back so the
            // sheet is never left stuck mid-drag.
            handle.addEventListener('pointercancel', () => endDrag(false));
        }

        // Initialize
        try { generateAppIcon(); } catch (e) { console.warn('Icon generation failed:', e); }
        loadData();
        loadUIState();
        loadSoundSetting();
        renderSoundToggle();
        render();

        initDraggableSheet('omnibus-sheet', hideOmnibusSheet);
        initDraggableSheet('child-sheet', hideChildSheet);
        initDraggableSheet('confirm-sheet', hideConfirmSheet);
        initDraggableSheet('actions-sheet', hideActionsSheet);
        initDraggableSheet('settings-sheet', hideSettingsSheet);

        // Re-measure expanded panels when the viewport changes, since a width
        // change can rewrap long titles and alter the height they need.
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(sizeChildPanels, 150);
        });

        if ('serviceWorker' in navigator) {
            // Only reload when a new worker takes over a page that was already
            // controlled. On a first visit the worker claims an uncontrolled
            // page, and reloading there just makes the app load twice.
            const wasControlled = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW registration failed:', e));
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!wasControlled || reloading) return;
                if (document.querySelector('.sheet.visible')) { pendingUpdateReload = true; return; }
                reloading = true;
                window.location.reload();
            });
        }
    </script>
</body>
</html>
